name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
    # A release tag runs CI too, or the tag check in release-consistency never fires.
    # v<version> is the manual form; the plugin tag command creates <name>--v<version>.
    tags: ['v*', '*--v*']
  workflow_dispatch:

# One run per ref; new pushes cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-skill:
    name: Validate skill & manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: SKILL.md frontmatter (name, description, naming and length rules)
        run: |
          python - <<'PY'
          import os, re, subprocess, sys, yaml
          files = subprocess.run(["git", "-c", "core.quotePath=false", "ls-files"],
                                 capture_output=True, text=True, check=True).stdout.splitlines()
          skills = sorted(f for f in files if os.path.basename(f) == "SKILL.md")
          if not skills:
              print("::error::no SKILL.md found in the repo")
              sys.exit(1)
          kebab = re.compile(r"^[a-z0-9]+(-[a-z0-9]+)*$")
          fence = re.compile(r"---\r?\n(.*?)\r?\n---[ \t]*(?:\r?\n|\Z)", re.S)
          bad = 0
          for path in skills:
              problems = []
              match = fence.match(open(path, encoding="utf-8").read())
              data = None
              if not match:
                  problems.append("missing or unclosed YAML frontmatter")
              else:
                  try:
                      data = yaml.safe_load(match.group(1))
                  except Exception as e:
                      problems.append(f"invalid frontmatter YAML: {e}")
                  else:
                      if not isinstance(data, dict):
                          problems.append("frontmatter is empty or not a mapping")
                          data = None
              if data is not None:
                  name, desc = data.get("name"), data.get("description")
                  for key, value in (("name", name), ("description", desc)):
                      if not isinstance(value, str) or not value.strip():
                          problems.append(f"frontmatter missing '{key}'")
                  folder = os.path.basename(os.path.dirname(os.path.abspath(path)))
                  if isinstance(name, str) and name.strip():
                      if not kebab.match(name) or len(name) > 64:
                          problems.append(f"name '{name}' is not kebab-case of 64 characters or fewer")
                      if name != folder:
                          problems.append(f"name '{name}' does not match its directory '{folder}'")
                  if isinstance(desc, str):
                      if len(desc) > 1024:
                          problems.append(f"description has {len(desc)} characters, the limit is 1024")
                      if "<" in desc or ">" in desc:
                          problems.append("description contains an angle bracket")
              for problem in problems:
                  print(f"::error file={path}::{problem}")
              if problems:
                  bad += 1
              else:
                  print(f"OK: {path} (description {len(desc)} characters)")
          sys.exit(1 if bad else 0)
          PY
      - name: Validate JSON manifests
        run: |
          python - <<'PY'
          import subprocess, sys, json, os
          # git ls-files sees dot-directories; glob('**/*.json') silently skips them,
          # so .claude-plugin/plugin.json (the file the loader parses) went unchecked.
          files = subprocess.run(["git", "-c", "core.quotePath=false", "ls-files", "*.json"],
                                 capture_output=True, text=True, check=True).stdout.splitlines()
          bad = 0
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8'))
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"::error file={f}::invalid JSON: {e}")
                  bad += 1
          manifest = ".claude-plugin/plugin.json"
          if manifest not in files:
              print(f"::error::{manifest} not found (plugin machinery parses it)")
              bad += 1
          else:
              try:
                  data = json.load(open(manifest, encoding='utf-8'))
                  for key in ("name", "version", "description", "skills"):
                      if not data.get(key):
                          print(f"::error file={manifest}::missing required key '{key}'")
                          bad += 1
                  skills = data.get("skills") or []
                  for entry in [skills] if isinstance(skills, str) else skills:
                      if not os.path.exists(os.path.normpath(str(entry))):
                          print(f"::error file={manifest}::skills path '{entry}' does not exist")
                          bad += 1
              except Exception:
                  pass  # JSON parse error already reported above
          sys.exit(1 if bad else 0)
          PY

  dash-ban:
    name: No em dash or en dash (md, sh, json, yml, yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked md, sh, json, yml and yaml files
        run: |
          python - <<'PY'
          import subprocess, sys
          files = subprocess.run(["git", "-c", "core.quotePath=false", "ls-files"],
                                 capture_output=True, text=True, check=True).stdout.split("\n")
          bad = scanned = 0
          for rel in files:
              rel = rel.strip()
              if not rel.endswith(('.md', '.sh', '.json', '.yml', '.yaml')):
                  continue
              scanned += 1
              with open(rel, encoding='utf-8', errors='replace') as handle:
                  for number, line in enumerate(handle, 1):
                      for char, name in ((chr(0x2014), "em dash"), (chr(0x2013), "en dash")):
                          if char in line:
                              print(f"::error file={rel},line={number}::{name} is banned in this repo")
                              bad += 1
          print(f"{scanned} file(s) scanned, {bad} offending line(s)")
          sys.exit(1 if bad or not scanned else 0)
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run shellcheck on scripts
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts; skipping shellcheck (gate stays green)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  markdownlint:
    name: Markdown (lenient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: markdownlint (non-blocking style, blocking parse)
        run: |
          mapfile -t md < <(git ls-files '*.md')
          if [ ${#md[@]} -eq 0 ]; then
            echo "No markdown files."
            exit 0
          fi
          for f in "${md[@]}"; do
            if [ ! -s "$f" ]; then echo "::error::empty markdown: $f"; exit 1; fi
          done
          npx --yes markdownlint-cli2 "**/*.md" "#node_modules" || \
            echo "::warning::markdownlint reported style issues (non-blocking)."

  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: plugin.json version has a CHANGELOG entry (and matches a pushed tag)
        run: |
          python - <<'PY'
          import json, os, re, sys
          manifest = json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))
          version, name = manifest['version'], manifest['name']
          changelog = open('CHANGELOG.md', encoding='utf-8').read()
          if not re.search(rf'^## \[{re.escape(version)}\]', changelog, re.M):
              print(f"::error::CHANGELOG.md has no entry for plugin.json version {version}")
              sys.exit(1)
          print(f"OK: CHANGELOG documents {version}")
          ref = os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/tags/'):
              tag = ref.split('/', 2)[2]
              allowed = (f"v{version}", f"{name}--v{version}")
              if tag not in allowed:
                  print(f"::error::tag {tag} is neither {allowed[0]} nor {allowed[1]} (plugin.json)")
                  sys.exit(1)
              print(f"OK: tag {tag} matches plugin.json")
          PY

  ci-passed:
    name: CI passed
    if: always()
    needs: [validate-skill, dash-ban, shellcheck, markdownlint, release-consistency]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A required CI job did not succeed."
          echo "Results: ${{ join(needs.*.result, ' ') }}"
          exit 1
      - name: All gates green
        run: echo "All CI jobs passed."
